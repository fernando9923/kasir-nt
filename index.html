<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#059669">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Kasir NT">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>NandoTeknik Kasir</title>
<style>
  :root{
    --brand:#059669; --brand-dark:#047857; --orange:#E8710A; --red:#D93025;
    --bg:#F1F3F4; --card:#fff; --text:#202124; --muted:#5F6368; --line:#e1e4e6;
    --radius:14px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:16px}
  body{min-height:100vh;padding-bottom:env(safe-area-inset-bottom)}
  .hidden{display:none!important}
  header.bar{position:sticky;top:0;z-index:5;background:var(--brand);color:#fff;padding:calc(12px + env(safe-area-inset-top)) 16px 12px;display:flex;align-items:center;gap:10px}
  header.bar h1{flex:1;margin:0;font-size:18px;font-weight:700}
  header.bar button{background:rgba(255,255,255,.18);color:#fff;border:0;border-radius:10px;padding:8px 12px;font-size:14px}
  main{padding:16px;max-width:560px;margin:0 auto}
  .card{background:var(--card);border-radius:var(--radius);padding:16px;margin-bottom:14px;box-shadow:0 1px 2px rgba(0,0,0,.06)}
  label{display:block;font-size:13px;font-weight:600;color:var(--muted);margin:12px 0 6px}
  label:first-child{margin-top:0}
  input,select{width:100%;padding:13px 12px;font-size:16px;border:1.5px solid var(--line);border-radius:10px;background:#fff;color:var(--text);outline:none}
  input:focus,select:focus{border-color:var(--brand)}
  button.btn{width:100%;padding:14px;font-size:16px;font-weight:700;border:0;border-radius:12px;background:var(--brand);color:#fff}
  button.btn:active{background:var(--brand-dark)}
  button.btn:disabled{background:#9bb9ae}
  button.btn.sec{background:#fff;color:var(--brand);border:1.5px solid var(--brand)}
  button.btn.danger{background:#fff;color:var(--red);border:1.5px solid var(--red)}
  .row{display:flex;gap:10px}
  .row>*{flex:1}
  .muted{color:var(--muted);font-size:13px}
  .err{background:#fdecea;color:#8c1d14;border-radius:10px;padding:10px 12px;font-size:14px;margin:0 0 12px}
  .ok{background:#e6f4ea;color:#0b5a2a;border-radius:10px;padding:10px 12px;font-size:14px;margin:0 0 12px}
  .total{display:flex;justify-content:space-between;align-items:baseline;padding:4px 2px 10px}
  .total b{font-size:20px}
  .nota{border:1.5px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px;background:#fff}
  .nota .top{display:flex;justify-content:space-between;gap:8px;font-weight:700}
  .nota .sub{color:var(--muted);font-size:13px;margin-top:2px}
  .nota .act{display:flex;gap:8px;margin-top:10px}
  .nota .act button{flex:1;padding:9px;border-radius:9px;border:1.5px solid var(--line);background:#fff;font-size:14px;font-weight:600}
  .nota .act button.d{color:var(--red);border-color:#f1b7b2}
  .tag{display:inline-block;font-size:11px;font-weight:700;border-radius:20px;padding:2px 8px;margin-left:6px;vertical-align:middle}
  .tag.Lunas{background:#e6f4ea;color:#0b5a2a}.tag.Sebagian{background:#fff3e0;color:#9a4d00}.tag.Belum{background:#fdecea;color:#8c1d14}
  h2{font-size:15px;margin:18px 2px 10px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}
  /* picker toko */
  .picker{position:relative}
  .picker .list{position:absolute;left:0;right:0;top:100%;z-index:10;background:#fff;border:1.5px solid var(--line);border-radius:10px;max-height:240px;overflow:auto;margin-top:4px;box-shadow:0 6px 16px rgba(0,0,0,.12)}
  .picker .list div{padding:12px;border-bottom:1px solid var(--line)}
  .picker .list div:active{background:#e6f4ea}
  .picker .terpilih{border-color:var(--brand);background:#f3fbf7}
  /* foto */
  .foto{border:2px dashed #b8c4be;border-radius:12px;padding:12px;text-align:center;background:#fafcfb}
  .foto img{max-width:100%;max-height:260px;border-radius:8px;display:block;margin:0 auto 10px}
  .foto input{display:none}
  .fab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom));background:var(--orange);color:#fff;border:0;border-radius:30px;padding:15px 22px;font-size:16px;font-weight:700;box-shadow:0 6px 16px rgba(0,0,0,.25);z-index:6}
  .modal{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
  .sheet{background:var(--bg);width:100%;max-width:560px;max-height:94vh;overflow:auto;border-radius:20px 20px 0 0;padding:16px 16px calc(24px + env(safe-area-inset-bottom))}
  .sheet h3{margin:0 0 12px;font-size:18px}
  .spin{display:inline-block;width:16px;height:16px;border:3px solid rgba(255,255,255,.5);border-top-color:#fff;border-radius:50%;animation:s .8s linear infinite;vertical-align:-3px;margin-right:8px}
  @keyframes s{to{transform:rotate(360deg)}}
  .login{max-width:380px;margin:12vh auto 0;padding:0 16px;text-align:center}
  .login img{width:84px;height:84px;border-radius:20px}
  .login h1{margin:12px 0 4px}
</style>
</head>
<body>

<!-- ========== LOGIN ========== -->
<div id="vLogin" class="login hidden">
  <img src="icons/icon-192.png" alt="">
  <h1>NandoTeknik Kasir</h1>
  <p class="muted" style="margin-top:0">Input nota yang dibawa sales</p>
  <div class="card" style="text-align:left">
    <div id="loginErr" class="err hidden"></div>
    <label for="inPass">Password kasir</label>
    <input id="inPass" type="password" autocomplete="current-password" placeholder="Password">
    <div style="height:14px"></div>
    <button id="btnLogin" class="btn">MASUK</button>
  </div>
</div>

<!-- ========== UTAMA ========== -->
<div id="vMain" class="hidden">
  <header class="bar">
    <h1>Kasir Nota</h1>
    <button id="btnRefresh" type="button">Muat ulang</button>
    <button id="btnLogout" type="button">Keluar</button>
  </header>
  <main>
    <div id="mainErr" class="err hidden"></div>
    <div class="card">
      <label for="selSales">Pilih sales</label>
      <select id="selSales"><option value="">Memuat daftar sales...</option></select>
    </div>

    <div id="blokNota" class="hidden">
      <div class="card">
        <div class="total"><span class="muted">Nota yang dibawa (belum dilaporkan)</span><b id="totalAktif">Rp0</b></div>
        <div id="listAktif"></div>
        <div id="kosongAktif" class="muted hidden" style="text-align:center;padding:14px 0">Belum ada nota. Ketuk <b>+ Tambah Nota</b>.</div>
      </div>
      <div id="blokRiwayat" class="hidden">
        <h2>Sudah dilaporkan sales (2 hari terakhir)</h2>
        <div class="card" id="listRiwayat"></div>
      </div>
      <div style="height:80px"></div>
    </div>
  </main>
  <button id="fabTambah" class="fab hidden" type="button">+ Tambah Nota</button>
</div>

<!-- ========== FORM NOTA ========== -->
<div id="mForm" class="modal hidden">
  <div class="sheet">
    <h3 id="formJudul">Tambah Nota</h3>
    <div class="muted" id="formSales" style="margin-bottom:10px"></div>
    <div id="formErr" class="err hidden"></div>

    <label for="inTanggal">Tanggal nota</label>
    <input id="inTanggal" type="date">

    <label for="inNo">Nomor nota</label>
    <input id="inNo" type="text" inputmode="text" autocomplete="off" placeholder="Nomor nota">

    <label for="inToko">Nama toko (pilih dari daftar)</label>
    <div class="picker">
      <input id="inToko" type="text" autocomplete="off" placeholder="Ketik untuk mencari toko...">
      <div id="listToko" class="list hidden"></div>
    </div>

    <label for="inNominal">Nominal nota (Rp)</label>
    <input id="inNominal" type="text" inputmode="numeric" autocomplete="off" placeholder="0">

    <label>Foto nota (wajib, langsung dari kamera)</label>
    <div class="foto">
      <img id="fotoPreview" class="hidden" alt="Foto nota">
      <div id="fotoInfo" class="muted" style="margin-bottom:10px">Belum ada foto</div>
      <button id="btnFoto" type="button" class="btn sec">AMBIL FOTO</button>
      <input id="inFoto" type="file" accept="image/*" capture="environment">
    </div>

    <div style="height:16px"></div>
    <div class="row">
      <button id="btnBatalForm" type="button" class="btn sec">BATAL</button>
      <button id="btnSimpan" type="button" class="btn">SIMPAN</button>
    </div>
  </div>
</div>

<script src="config.js"></script>
<script>
(function () {
  'use strict';
  var API = (window.KASIR_CONFIG || {}).API_URL;
  var $ = function (id) { return document.getElementById(id); };

  var state = {
    pass: '', sales: '', customers: [], salesList: [],
    aktif: [], riwayat: [],
    edit: null,            // nota yang sedang diedit (null = tambah baru)
    clientId: '',          // kunci anti-dobel untuk 1 percobaan simpan
    fotoB64: '', fotoUrl: '', tokoTerpilih: '', menyimpan: false
  };

  // ---------- util ----------
  function rp(n) {
    n = Math.round(Number(n) || 0);
    return (n < 0 ? '-' : '') + 'Rp' + String(Math.abs(n)).replace(/\B(?=(\d{3})+(?!\d))/g, '.');
  }
  function hariIni() {
    var d = new Date(), p = function (x) { return String(x).padStart(2, '0'); };
    return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate());
  }
  function tglTampil(t) {
    var m = String(t || '').match(/^(\d{4})-(\d{2})-(\d{2})/);
    return m ? m[3] + '/' + m[2] + '/' + m[1] : t;
  }
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function uuid() {
    if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
    return 'c' + Date.now().toString(36) + Math.random().toString(36).slice(2, 10);
  }
  function show(el, v) { $(el).classList.toggle('hidden', !v); }
  function pesan(el, teks) { var e = $(el); if (teks) { e.textContent = teks; e.classList.remove('hidden'); } else e.classList.add('hidden'); }

  // POST ke Apps Script. Content-Type text/plain = "simple request" -> tidak ada preflight CORS yang ditolak Apps Script.
  function api(body) {
    body.kasirPassword = state.pass;
    var ctl = new AbortController();
    var t = setTimeout(function () { ctl.abort(); }, 90000);
    return fetch(API, {
      method: 'POST', redirect: 'follow', signal: ctl.signal,
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(body)
    }).then(function (r) { return r.json(); })
      .catch(function (e) {
        var er = new Error(e && e.name === 'AbortError' ? 'Server terlalu lama membalas. Cek sinyal lalu coba lagi.' : 'Tidak bisa terhubung ke server. Cek sinyal internet.');
        er.net = true; throw er;
      }).finally(function () { clearTimeout(t); });
  }

  // ---------- login ----------
  function tampilLogin() { show('vLogin', true); show('vMain', false); }
  function tampilMain() { show('vLogin', false); show('vMain', true); }

  function doLogin(pass, auto) {
    state.pass = pass;
    $('btnLogin').disabled = true; $('btnLogin').textContent = 'Memeriksa...';
    return api({ action: 'kasir_login' }).then(function (r) {
      if (!r.ok) throw new Error(r.error || 'Login gagal');
      try { localStorage.setItem('kasir_pass', pass); } catch (e) {}
      tampilMain();
      return muatAwal();
    }).catch(function (e) {
      state.pass = '';
      // Password hanya dihapus kalau server menolaknya; gangguan sinyal tidak boleh membuat kasir harus ketik ulang.
      if (!e.net) { try { localStorage.removeItem('kasir_pass'); } catch (x) {} }
      tampilLogin();
      if (!auto || e.net) pesan('loginErr', e.message); else pesan('loginErr', '');
    }).finally(function () { $('btnLogin').disabled = false; $('btnLogin').textContent = 'MASUK'; });
  }

  $('btnLogin').onclick = function () { var p = $('inPass').value; if (!p) return pesan('loginErr', 'Isi password.'); pesan('loginErr', ''); doLogin(p, false); };
  $('inPass').addEventListener('keydown', function (e) { if (e.key === 'Enter') $('btnLogin').click(); });
  $('btnLogout').onclick = function () {
    try { localStorage.removeItem('kasir_pass'); localStorage.removeItem('kasir_sales'); } catch (e) {}
    state.pass = ''; $('inPass').value = ''; tampilLogin();
  };

  // ---------- data awal ----------
  function muatAwal() {
    pesan('mainErr', '');
    return Promise.all([api({ action: 'kasir_getSales' }), api({ action: 'kasir_getCustomers' })]).then(function (rs) {
      if (!rs[0].ok) throw new Error(rs[0].error);
      if (!rs[1].ok) throw new Error(rs[1].error);
      state.salesList = rs[0].sales; state.customers = rs[1].customers;
      var sel = $('selSales');
      sel.innerHTML = '<option value="">-- pilih sales --</option>' + state.salesList.map(function (s) { return '<option>' + esc(s) + '</option>'; }).join('');
      var terakhir = ''; try { terakhir = localStorage.getItem('kasir_sales') || ''; } catch (e) {}
      if (terakhir && state.salesList.indexOf(terakhir) !== -1) { sel.value = terakhir; return pilihSales(terakhir); }
      show('blokNota', false); show('fabTambah', false);
    }).catch(function (e) { pesan('mainErr', e.message); });
  }

  $('btnRefresh').onclick = function () { if (state.sales) pilihSales(state.sales); else muatAwal(); };
  $('selSales').onchange = function () { pilihSales(this.value); };

  function pilihSales(nama) {
    state.sales = nama;
    try { localStorage.setItem('kasir_sales', nama); } catch (e) {}
    if (!nama) { show('blokNota', false); show('fabTambah', false); return Promise.resolve(); }
    show('blokNota', true); show('fabTambah', true);
    $('listAktif').innerHTML = '<div class="muted" style="text-align:center;padding:14px">Memuat...</div>';
    return api({ action: 'kasir_listNota', sales: nama }).then(function (r) {
      if (!r.ok) throw new Error(r.error);
      if (state.sales !== nama) return; // sales diganti selagi memuat
      state.aktif = r.aktif; state.riwayat = r.riwayat; pesan('mainErr', ''); render();
    }).catch(function (e) { pesan('mainErr', e.message); $('listAktif').innerHTML = ''; });
  }

  // ---------- render list ----------
  function kartuNota(n, bisaEdit) {
    var tag = n.status === 'Lunas' ? 'Lunas' : (n.status === 'Sebagian' ? 'Sebagian' : (n.status === 'Belum Bayar' ? 'Belum' : ''));
    var h = '<div class="nota"><div class="top"><span>' + esc(n.noNota) + (tag ? '<span class="tag ' + tag + '">' + esc(n.status) + '</span>' : '') + '</span><span>' + rp(n.nominal) + '</span></div>' +
      '<div class="sub">' + esc(n.namaToko) + ' &middot; ' + esc(tglTampil(n.tanggal)) + '</div>';
    if (!bisaEdit && n.status !== 'Dibawa') h += '<div class="sub">Dibayar: ' + rp(n.nominalDibayar) + '</div>';
    if (bisaEdit) h += '<div class="act"><button data-edit="' + esc(n.notaId) + '">Edit</button><button class="d" data-del="' + esc(n.notaId) + '">Hapus</button></div>';
    return h + '</div>';
  }
  function render() {
    var total = state.aktif.reduce(function (a, n) { return a + n.nominal; }, 0);
    $('totalAktif').textContent = rp(total) + ' (' + state.aktif.length + ' nota)';
    $('listAktif').innerHTML = state.aktif.map(function (n) { return kartuNota(n, true); }).join('');
    show('kosongAktif', state.aktif.length === 0);
    show('blokRiwayat', state.riwayat.length > 0);
    $('listRiwayat').innerHTML = state.riwayat.map(function (n) { return kartuNota(n, false); }).join('');
  }

  $('listAktif').addEventListener('click', function (e) {
    var t = e.target;
    if (t.dataset.edit) {
      var n = state.aktif.filter(function (x) { return x.notaId === t.dataset.edit; })[0];
      if (n) bukaForm(n);
    } else if (t.dataset.del) {
      var d = state.aktif.filter(function (x) { return x.notaId === t.dataset.del; })[0];
      if (d && confirm('Hapus nota ' + d.noNota + ' (' + d.namaToko + ', ' + rp(d.nominal) + ')?\nFoto di Telegram juga ikut dihapus.')) hapus(d, t);
    }
  });

  function hapus(n, btn) {
    btn.disabled = true; btn.textContent = '...';
    api({ action: 'kasir_hapusNota', notaId: n.notaId }).then(function (r) {
      if (!r.ok) throw new Error(r.error);
      state.aktif = state.aktif.filter(function (x) { return x.notaId !== n.notaId; }); render();
    }).catch(function (e) { alert(e.message); btn.disabled = false; btn.textContent = 'Hapus'; });
  }

  // ---------- form ----------
  function bukaForm(nota) {
    if (!state.sales) return;
    state.edit = nota || null;
    state.clientId = uuid();
    state.fotoB64 = ''; state.fotoUrl = '';
    state.tokoTerpilih = nota ? nota.namaToko : '';
    $('formJudul').textContent = nota ? 'Edit Nota' : 'Tambah Nota';
    $('formSales').textContent = 'Sales: ' + state.sales;
    pesan('formErr', '');
    var tglTerakhir = ''; try { tglTerakhir = localStorage.getItem('kasir_tgl') || ''; } catch (e) {}
    $('inTanggal').value = nota ? nota.tanggal : (tglTerakhir || hariIni());
    $('inNo').value = nota ? nota.noNota : '';
    $('inToko').value = nota ? nota.namaToko : '';
    $('inToko').classList.toggle('terpilih', !!nota);
    $('inNominal').value = nota ? formatAngka(nota.nominal) : '';
    renderFoto();
    show('listToko', false);
    show('mForm', true);
    document.body.style.overflow = 'hidden';
  }
  function tutupForm() { show('mForm', false); document.body.style.overflow = ''; state.edit = null; }
  $('fabTambah').onclick = function () { bukaForm(null); };
  $('btnBatalForm').onclick = function () { if (!state.menyimpan) tutupForm(); };

  function formatAngka(n) { return String(Math.round(Number(n) || 0)).replace(/\B(?=(\d{3})+(?!\d))/g, '.'); }
  function angkaDari(s) { return parseInt(String(s).replace(/\D/g, ''), 10) || 0; }
  $('inNominal').addEventListener('input', function () { var n = angkaDari(this.value); this.value = n ? formatAngka(n) : ''; });

  // picker toko: wajib memilih dari daftar CustomerList
  function renderListToko() {
    var q = $('inToko').value.trim().toLowerCase();
    var hasil = state.customers.filter(function (c) { return !q || c.toLowerCase().indexOf(q) !== -1; }).slice(0, 40);
    var l = $('listToko');
    l.innerHTML = hasil.length ? hasil.map(function (c) { return '<div data-v="' + esc(c) + '">' + esc(c) + '</div>'; }).join('')
      : '<div class="muted">Toko tidak ditemukan di CustomerList</div>';
    show('listToko', true);
  }
  $('inToko').addEventListener('input', function () {
    state.tokoTerpilih = ''; this.classList.remove('terpilih'); renderListToko();
  });
  $('inToko').addEventListener('focus', renderListToko);
  $('listToko').addEventListener('click', function (e) {
    var v = e.target.dataset && e.target.dataset.v;
    if (!v) return;
    state.tokoTerpilih = v; $('inToko').value = v; $('inToko').classList.add('terpilih'); show('listToko', false);
  });
  document.addEventListener('click', function (e) { if (!e.target.closest('.picker')) show('listToko', false); });

  // foto: kamera langsung, dikompres di HP supaya ringan dikirim (maks sisi 1280px, JPEG 72%)
  $('btnFoto').onclick = function () { $('inFoto').click(); };
  $('inFoto').addEventListener('change', function () {
    var f = this.files && this.files[0]; this.value = '';
    if (!f) return;
    kompres(f).then(function (r) { state.fotoB64 = r.b64; state.fotoUrl = r.url; pesan('formErr', ''); renderFoto(); })
      .catch(function () { pesan('formErr', 'Foto tidak bisa diproses, coba ambil ulang.'); });
  });
  function renderFoto() {
    var ada = !!state.fotoUrl;
    show('fotoPreview', ada);
    if (ada) $('fotoPreview').src = state.fotoUrl;
    $('fotoInfo').textContent = ada ? 'Foto siap dikirim' : (state.edit ? 'Foto lama tetap dipakai. Ambil foto baru kalau mau mengganti.' : 'Belum ada foto');
    $('btnFoto').textContent = ada ? 'FOTO ULANG' : (state.edit ? 'GANTI FOTO' : 'AMBIL FOTO');
  }
  function kompres(file) {
    return new Promise(function (resolve, reject) {
      var url = URL.createObjectURL(file), img = new Image();
      img.onload = function () {
        var max = 1280, w = img.naturalWidth, h = img.naturalHeight, s = Math.min(1, max / Math.max(w, h));
        var c = document.createElement('canvas'); c.width = Math.round(w * s); c.height = Math.round(h * s);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        URL.revokeObjectURL(url);
        var data = c.toDataURL('image/jpeg', 0.72);
        resolve({ b64: data.split(',')[1], url: data });
      };
      img.onerror = function () { URL.revokeObjectURL(url); reject(new Error('gambar')); };
      img.src = url;
    });
  }

  $('btnSimpan').onclick = function () {
    if (state.menyimpan) return;
    var tanggal = $('inTanggal').value, no = $('inNo').value.trim(), nominal = angkaDari($('inNominal').value);
    if (!tanggal) return pesan('formErr', 'Isi tanggal nota.');
    if (!no) return pesan('formErr', 'Isi nomor nota.');
    if (!state.tokoTerpilih || state.tokoTerpilih !== $('inToko').value) return pesan('formErr', 'Pilih nama toko dari daftar (ketuk salah satu hasil pencarian).');
    if (nominal <= 0) return pesan('formErr', 'Isi nominal nota.');
    if (!state.edit && !state.fotoB64) return pesan('formErr', 'Foto nota wajib diambil dengan kamera.');
    pesan('formErr', '');

    var body = state.edit
      ? { action: 'kasir_editNota', notaId: state.edit.notaId }
      : { action: 'kasir_tambahNota', sales: state.sales, clientId: state.clientId };
    body.tanggal = tanggal; body.noNota = no; body.namaToko = state.tokoTerpilih; body.nominal = nominal;
    if (state.fotoB64) body.fotoBase64 = state.fotoB64;

    state.menyimpan = true;
    var btn = $('btnSimpan'); btn.disabled = true; btn.innerHTML = '<span class="spin"></span>Mengirim...';
    api(body).then(function (r) {
      if (!r.ok) throw new Error(r.error || 'Gagal menyimpan');
      try { localStorage.setItem('kasir_tgl', tanggal); } catch (e) {}
      var lanjut = !state.edit;
      tutupForm();
      return pilihSales(state.sales).then(function () { if (lanjut) toastOk('Nota ' + no + ' tersimpan & foto terkirim ke Telegram.'); });
    }).catch(function (e) { pesan('formErr', e.message); })
      .finally(function () { state.menyimpan = false; btn.disabled = false; btn.textContent = 'SIMPAN'; });
  };

  function toastOk(t) { pesan('mainErr', ''); var e = $('mainErr'); e.className = 'ok'; e.textContent = t; setTimeout(function () { e.className = 'err hidden'; }, 3500); }

  // ---------- start ----------
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function () {});
  var tersimpan = ''; try { tersimpan = localStorage.getItem('kasir_pass') || ''; } catch (e) {}
  if (tersimpan) doLogin(tersimpan, true); else tampilLogin();
})();
</script>
</body>
</html>
